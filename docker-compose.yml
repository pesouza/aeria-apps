services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_URL: ${SITE_URL:-https://aeria-apps.com.br}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      CONTENT_FILE: /data/content.json
    volumes:
      - .:/app
      - ./data:/app/data
      - /opt/data/profiles/paulo-bot/indica-aqui:/data/indica-aqui
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.aeria.rule=Host(`aeria-apps.com.br`) || Host(`www.aeria-apps.com.br`) || Host(`lfa.aeria-apps.com.br`) || Host(`curso-lfa.aeria-apps.com.br`) || Host(`curso.aeria-apps.com.br`)
      - traefik.http.routers.aeria.entrypoints=web,websecure
      - traefik.http.routers.aeria.tls.certresolver=letsencrypt
      - traefik.http.services.aeria.loadbalancer.server.port=8000
    networks:
      - traefik

  atendeai:
    build: ./atendeai
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ATENDEAI_ADMIN_TOKEN: ${ATENDEAI_ADMIN_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.atendeai.rule=Host(`atendeai.aeria-apps.com.br`)
      - traefik.http.routers.atendeai.entrypoints=web,websecure
      - traefik.http.routers.atendeai.tls.certresolver=letsencrypt
      - traefik.http.services.atendeai.loadbalancer.server.port=8787
    networks:
      - traefik

networks:
  traefik:
    external: true
