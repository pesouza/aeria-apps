<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#brand-grad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Automata State Machine Transition Arcs -->
  <path d="M 180 256 A 90 90 0 0 1 332 256" fill="none" stroke="url(#brand-grad)" stroke-width="6" filter="url(#glow)" />
  <polygon points="332,256 318,244 322,266" fill="#818cf8" />

  <path d="M 332 256 A 90 90 0 0 1 180 256" fill="none" stroke="url(#brand-grad)" stroke-width="6" stroke-dasharray="6 6" />
  <polygon points="180,256 194,268 190,246" fill="#38bdf8" />

  <!-- Initial Arrow -->
  <path d="M 90 256 L 140 256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <polygon points="140,256 126,246 126,266" fill="#38bdf8" />

  <!-- Node Q0 (State 1) -->
  <circle cx="180" cy="256" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="6" filter="url(#glow)" />
  <circle cx="180" cy="256" r="12" fill="#38bdf8" />

  <!-- Node Q1 (Accepting Double Circle State) -->
  <circle cx="332" cy="256" r="42" fill="#0f172a" stroke="url(#brand-grad)" stroke-width="6" filter="url(#glow)" />
  <circle cx="332" cy="256" r="32" fill="none" stroke="#818cf8" stroke-width="4" />
  <circle cx="332" cy="256" r="14" fill="#c084fc" />
</svg>